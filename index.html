<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onde assistir o debate com checagem de fatos ao vivo</title>
  <meta name="description" content="Links para acompanhar o debate com checagem de fatos ao vivo.">
  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --card: #fff; --border: #e2e2e2; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #f0f0f0; --card: #1e1e1e; --border: #333; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 48px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--fg);
    }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; text-align: center; }
    p.sub { margin: 0 0 32px; text-align: center; opacity: .7; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a {
      display: block; padding: 14px 18px; text-align: center;
      background: var(--card); color: var(--fg); text-decoration: none;
      border: 1px solid var(--border); border-radius: 10px; font-weight: 500;
      transition: border-color .15s, transform .15s;
    }
    a:hover, a:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>Onde assistir o debate com checagem de fatos ao vivo</h1>
    <p class="sub">Escolha um dos links abaixo.</p>
    <ul>
      <!-- Para adicionar um link, copie uma linha <li> e troque o endereço e o texto -->
      <li><a href="https://www.checagemaovivo.org/" target="_blank" rel="noopener">Checagem ao Vivo</a></li>
      <li><a href="https://checagemaovivo.vercel.app/sala/band-ao-vivo" target="_blank" rel="noopener">Checagem ao Vivo (Band)</a></li>
      <li><a href="https://rodape.org/" target="_blank" rel="noopener">Rodapé</a></li>
      <li><a href="https://www.fatocarimbado.com.br/" target="_blank" rel="noopener">Fato Carimbado</a></li>
      <li><a href="https://checadebate.com.br/" target="_blank" rel="noopener">Checa Debate</a></li>
      <li><a href="https://vardebate.com.br" target="_blank" rel="noopener">VAR do Debate</a></li>
      <li><a href="https://verifiqueosfatos.com/" target="_blank" rel="noopener">Verifique os Fatos</a></li>
      <li><a href="https://debateglobo.com.br" target="_blank" rel="noopener">Debate Globo</a></li>
    </ul>
  </main>
</body>
</html>
